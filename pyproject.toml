[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenda-watcher"
version = "0.1.0"
description = "Finds local government agenda items that affect animals and tells you how to show up."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pypdf>=4", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aaw = "agenda_watcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
